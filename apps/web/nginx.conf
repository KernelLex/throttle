# nginx config for the Throttle SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. The API sets its own; these cover the static assets.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed asset filenames are immutable, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NOT be cached, or users keep loading a stale bundle that
  # references asset hashes which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback: client-side routes like /dashboard have no file on disk, so
  # anything unmatched serves index.html and lets React Router take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
